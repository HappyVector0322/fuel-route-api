services:
  web:
    build: .
    image: fuel-route-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      # Point at a self-hosted OSRM instance to avoid the public demo server's latency.
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    volumes:
      - db-data:/app/var
    restart: unless-stopped

volumes:
  db-data:
